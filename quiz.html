<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>数字にまつわるクイズ</title>

<style>
body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 80px 20px;
    text-align: center;
    color: #222;
}

h1 {
    font-weight: normal;
    margin-bottom: 40px;
}

.description {
    line-height: 1.8;
    margin-bottom: 45px;
}

.question {
    font-size: 24px;
    letter-spacing: 2px;
    margin: 40px 0;
    line-height: 1.8;
}

.explanation {
    text-align: left;
    line-height: 1.9;
    margin-top: 35px;
    white-space: pre-wrap;
}

input {
    width: 200px;
    padding: 12px;
    font-size: 18px;
    box-sizing: border-box;
    text-align: center;
    margin-top: 10px;
}

button {
    padding: 12px 22px;
    font-size: 16px;
    margin: 8px;
    cursor: pointer;
}

#result {
    margin-top: 25px;
    min-height: 3.6em;
    font-weight: bold;
    white-space: pre-line;
    line-height: 1.8;
}

#quit {
    margin-top: 60px;
}

#quit button {
    margin-left: 0;
}

.stage {
    margin-top: 30px;
    margin-bottom: 40px;
}

.score {
    font-size: 20px;
    margin: 30px 0;
}

.next-button {
    margin-top: 35px;
}

#progress {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 14px;
    color: #666;
}

#progress button {
    border: none;
    background: none;
    padding: 0;
    margin: 0;
    font-size: 14px;
    color: #666;
    cursor: pointer;
}

.hidden {
    display: none;
}

.start-button {
    font-size: 18px;
    padding: 14px 30px;
}

.choice-button {
    min-width: 100px;
}
</style>

</head>

<body>

<h1>数字にまつわるクイズ</h1>

<div id="startScreen">

    <div class="description">
        <p>
        数字にまつわるクイズです。<br>
        解説に雑学があるのでそちらも是非。
        </p>
    </div>
    
    <div id="progress">
    <button onclick="location.href='history.html'">
        <span id="progressCount"></span> ▾
    </button>
</div>

<button class="start-button" onclick="startChallenge()">挑戦</button>

<button class="start-button" onclick="startReview()">復習</button>

<button class="start-button" onclick="startAll()">総当</button>

</div>

<div id="quizScreen" class="hidden">

    <div class="question" id="question"></div>

    <input
        type="text"
        id="answer"
        inputmode="numeric"
        maxlength="6"
    >

    <button onclick="checkAnswer()">ENTER</button>

    <p id="result"></p>

    <div id="explanation" class="explanation"></div>

    <button
        id="nextButton"
        class="next-button hidden"
        onclick="nextAfterExplanation()"
    >
        次の問題へ
    </button>

</div>

<div id="continueScreen" class="hidden">

    <div class="stage">
        <h2><span id="blockCount"></span>問終了！</h2>

        <div class="score" id="score"></div>

        <p>
        まだやる？
        </p>

        <button class="choice-button" onclick="continueQuiz()">はい</button>
        <button class="choice-button" onclick="quitQuiz()">いいえ</button>
    </div>

</div>

<div id="finalStageScreen" class="hidden">

    <div class="stage">

        <h2>最終ステージ</h2>

        <p>
        残りの問題はあと
        <span id="remainingCount"></span>
        問です。
        </p>

        <p>
        ここから最後まで一気にいきましょう。
        </p>

        <button class="start-button" onclick="startFinalStage()">
            進む
        </button>

    </div>

</div>

<div id="finishScreen" class="hidden">

    <div class="stage">

        <h2>終了！</h2>

        <div class="score" id="finalScore"></div>

        <button onclick="quitQuiz()">最初に戻る</button>

    </div>

</div>

<!-- クイズデータ -->
<script src="quiz_data.js"></script>

<script>

/* =========================
   クイズの状態
========================= */

let remainingQuestions = [];
let currentQuestion = null;

let totalAnswered = 0;
let correctAnswers = 0;

let currentBlockAnswered = 0;
let finalStage = false;

// 正解した問題を保存
let solvedQuestions =
    JSON.parse(localStorage.getItem("solvedQuestions")) || [];

/* =========================
   年に関する問題
========================= */

function getNextLeapYear() {

    const currentYear = new Date().getFullYear();

    let year = currentYear + 1;

    while (!isLeapYear(year)) {
        year++;
    }

    return String(year);
}

function isLeapYear(year) {

    return (
        year % 400 === 0 ||
        (year % 4 === 0 && year % 100 !== 0)
    );

}

/* =========================
   画面切り替え
========================= */

function hideAllScreens() {

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("continueScreen").classList.add("hidden");
    document.getElementById("finalStageScreen").classList.add("hidden");
    document.getElementById("finishScreen").classList.add("hidden");

}

function updateProgress() {

    const progressCount =
        document.getElementById("progressCount");

    progressCount.textContent =
        solvedQuestions.length + " / " + questions.length;
}

/* =========================
   クイズ開始
========================= */

function startChallenge() {

    remainingQuestions = questions.filter(function(question) {
        return !solvedQuestions.includes(question.id);
    });

    totalAnswered = 0;
    correctAnswers = 0;
    currentBlockAnswered = 0;
    finalStage = false;

    if (remainingQuestions.length === 0) {
        alert("挑戦できる問題はありません。");
        return;
    }

    hideAllScreens();
    nextQuestion();
}

function startReview() {

    remainingQuestions = questions.filter(function(question) {
        return solvedQuestions.includes(question.id);
    });

    totalAnswered = 0;
    correctAnswers = 0;
    currentBlockAnswered = 0;
    finalStage = false;

    if (remainingQuestions.length === 0) {
        alert("まだ復習できる問題はありません。");
        return;
    }

    hideAllScreens();
    nextQuestion();
}

function startAll() {

    remainingQuestions = [...questions];

    totalAnswered = 0;
    correctAnswers = 0;
    currentBlockAnswered = 0;
    finalStage = false;

    hideAllScreens();
    nextQuestion();
}


/* =========================
   問題をランダムに取り出す
========================= */

function nextQuestion() {

    hideAllScreens();

    if (remainingQuestions.length === 0) {

        finishQuiz();

        return;
    }

    const randomIndex =
        Math.floor(Math.random() * remainingQuestions.length);

    currentQuestion =
        remainingQuestions.splice(randomIndex, 1)[0];

    document.getElementById("question").textContent =
        currentQuestion.question;

    document.getElementById("answer").value = "";

    document.getElementById("answer").disabled = false;

    document.getElementById("result").textContent = "";

    document.getElementById("explanation").textContent = "";

    document.getElementById("nextButton").classList.add("hidden");

    document.getElementById("quizScreen").classList.remove("hidden");

    document.getElementById("answer").focus();

}

/* =========================
   答え合わせ
========================= */

function checkAnswer() {

    const answer =
        document.getElementById("answer").value.trim();

    const result =
        document.getElementById("result");

    if (answer === "") {
        return;
    }

    document.getElementById("answer").disabled = true;

    totalAnswered++;
    currentBlockAnswered++;

    const correct =
        currentQuestion.answer.includes(answer);

    const correctAnswerText =
        currentQuestion.answer.join(" または ");

    if (correct) {

        correctAnswers++;
        
        if (!solvedQuestions.includes(currentQuestion.id)) {

    solvedQuestions.push(currentQuestion.id);

    localStorage.setItem(
        "solvedQuestions",
        JSON.stringify(solvedQuestions)
    );

}

        result.textContent =
            "アタリ〜！\n" +
            "正解は " +
            correctAnswerText +
            " です。";

    } else {

        result.textContent =
            "ザンネン...!\n" +
            "正解は " +
            correctAnswerText +
            " です。";

    }

    document.getElementById("explanation").textContent =
        currentQuestion.explanation;

    document.getElementById("nextButton").classList.remove("hidden");

}

/* =========================
   解説後の「次の問題へ」
========================= */

function nextAfterExplanation() {

    if (!finalStage && currentBlockAnswered < 10) {

        nextQuestion();

        return;
    }

    if (finalStage) {

        if (remainingQuestions.length === 0) {

            finishQuiz();

        } else {

            nextQuestion();

        }

        return;
    }

    showContinueScreen();

}

/* =========================
   10問終了後
========================= */

function showContinueScreen() {

    hideAllScreens();

    document.getElementById("blockCount").textContent =
        totalAnswered;

    const score =
        document.getElementById("score");

    score.textContent =
        correctAnswers + " / " + totalAnswered;

    document
        .getElementById("continueScreen")
        .classList.remove("hidden");

}

/* =========================
   「はい」
========================= */

function continueQuiz() {

    currentBlockAnswered = 0;

    if (remainingQuestions.length <= 9) {

        showFinalStage();

        return;
    }

    nextQuestion();

}

/* =========================
   最終ステージ表示
========================= */

function showFinalStage() {

    hideAllScreens();

    finalStage = true;

    document.getElementById("remainingCount").textContent =
        remainingQuestions.length;

    document
        .getElementById("finalStageScreen")
        .classList.remove("hidden");

}

/* =========================
   最終ステージ開始
========================= */

function startFinalStage() {

    currentBlockAnswered = 0;

    nextQuestion();

}

/* =========================
   クイズ終了
========================= */

function finishQuiz() {

    hideAllScreens();

    document.getElementById("finalScore").textContent =
        correctAnswers + " / " + totalAnswered;

    document
        .getElementById("finishScreen")
        .classList.remove("hidden");

}

/* =========================
   クイズをやめる
========================= */

function quitQuiz() {

    window.location.href = "index.html";

}

/* =========================
   Enterキーでも回答
========================= */

document
    .getElementById("answer")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            checkAnswer();

        }

    });
    
    updateProgress();

</script>

</body>
</html>
