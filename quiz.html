let currentQuestion = null;
let answered = false;


/* 次の閏年を求める */
function getNextLeapYear() {

    const currentYear = new Date().getFullYear();

    let year = currentYear + 1;

    while (!isLeapYear(year)) {
        year++;
    }

    return year;
}


/* うるう年判定 */
function isLeapYear(year) {

    return (
        year % 400 === 0 ||
        (year % 4 === 0 && year % 100 !== 0)
    );

}


/* ランダムに問題を選ぶ */
function nextQuestion() {

    answered = false;

    document.getElementById("result").textContent = "";
    document.getElementById("explanation").innerHTML = "";
    document.getElementById("next").classList.add("hidden");

    const answerArea = document.getElementById("answerArea");
    const choices = document.getElementById("choices");

    answerArea.classList.remove("hidden");
    choices.classList.add("hidden");
    choices.innerHTML = "";

    currentQuestion =
        questions[Math.floor(Math.random() * questions.length)];

    document.getElementById("question").innerHTML =
        currentQuestion.question;

    if (currentQuestion.type === "choice") {

        answerArea.classList.add("hidden");
        choices.classList.remove("hidden");

        currentQuestion.choices.forEach(choice => {

            const button = document.createElement("button");

            button.textContent = choice;
            button.className = "choice";

            button.onclick = function() {
                checkChoice(choice);
            };

            choices.appendChild(button);

        });

    } else {

        document.getElementById("answer").value = "";
        document.getElementById("answer").focus();

    }

}


/* 通常の入力問題 */
function checkAnswer() {

    if (answered) return;

    const answer =
        document.getElementById("answer").value.trim();

    checkAnswerValue(answer);

}


/* 選択問題 */
function checkChoice(answer) {

    if (answered) return;

    checkAnswerValue(answer);

}


/* 正解判定 */
function checkAnswerValue(answer) {

    const result = document.getElementById("result");
    const explanation = document.getElementById("explanation");

    if (currentQuestion.answer.includes(answer)) {

        answered = true;

        result.textContent = "正解！";

        explanation.innerHTML =
            currentQuestion.explanation;

        document.getElementById("next")
            .classList.remove("hidden");

    } else {

        result.textContent = "ちがいます";

    }

}


/* Enterキーでも回答できる */
document.getElementById("answer").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            checkAnswer();
        }

    }
);


/* クイズをやめる */
function quitQuiz() {

    window.location.href = "index.html";

}


/* 最初の問題 */
nextQuestion();
