<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>数字にまつわるクイズ</title>

<style>
body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 80px 20px;
    text-align: center;
    color: #222;
}

h1 {
    font-weight: normal;
    margin-bottom: 40px;
}

.description {
    line-height: 1.8;
    margin-bottom: 45px;
}

.question {
    font-size: 24px;
    letter-spacing: 2px;
    margin: 40px 0;
    line-height: 1.8;
}

.explanation {
    text-align: left;
    line-height: 1.9;
    margin-top: 35px;
    white-space: pre-wrap;
}

input {
    width: 200px;
    padding: 12px;
    font-size: 18px;
    box-sizing: border-box;
    text-align: center;
    margin-top: 10px;
}

button {
    padding: 12px 22px;
    font-size: 16px;
    margin: 8px;
    cursor: pointer;
}

#result {
    margin-top: 25px;
    min-height: 3.6em;
    font-weight: bold;
    white-space: pre-line;
    line-height: 1.8;
}

#quit {
    margin-top: 60px;
}

#quit button {
    margin-left: 0;
}

.stage {
    margin-top: 30px;
    margin-bottom: 40px;
}

.score {
    font-size: 20px;
    margin: 30px 0;
}

.next-button {
    margin-top: 35px;
}

.hidden {
    display: none;
}

.start-button {
    font-size: 18px;
    padding: 14px 30px;
}

.choice-button {
    min-width: 100px;
}
</style>

</head>

<body>

<h1>数字にまつわるクイズ</h1>

<div id="startScreen">

    <div class="description">
        <p>
        数字にまつわるクイズです。<br>
        全問正解を目指してください。
        </p>
    </div>

    <button class="start-button" onclick="startQuiz()">スタート</button>

</div>


<div id="quizScreen" class="hidden">

    <div class="question" id="question"></div>

    <input
        type="password"
        id="answer"
        inputmode="numeric"
        maxlength="6"
    >

    <button onclick="checkAnswer()">ENTER</button>

    <p id="result"></p>

    <div id="explanation" class="explanation"></div>

    <button
        id="nextButton"
        class="next-button hidden"
        onclick="nextAfterExplanation()"
    >
        次の問題へ
    </button>

</div>


<div id="continueScreen" class="hidden">

    <div class="stage">
        <h2>5問終了！</h2>

        <div class="score" id="score"></div>

        <p>
        まだやる？
        </p>

        <button class="choice-button" onclick="continueQuiz()">はい</button>
        <button class="choice-button" onclick="quitQuiz()">いいえ</button>
    </div>

</div>


<div id="finalStageScreen" class="hidden">

    <div class="stage">

        <h2>最終ステージ</h2>

        <p>
        残りの問題はあと
        <span id="remainingCount"></span>
        問です。
        </p>

        <p>
        ここから最後まで一気にいきましょう。
        </p>

        <button class="start-button" onclick="startFinalStage()">
            進む
        </button>

    </div>

</div>


<div id="finishScreen" class="hidden">

    <div class="stage">

        <h2>終了！</h2>

        <div class="score" id="finalScore"></div>

        <button onclick="quitQuiz()">最初に戻る</button>

    </div>

</div>


<script>

const questions = [

    {
        question: `点字の1文字は、最大何個の点からできている？`,
        answer: ["6"],
        explanation: `点字は、2列×3段、6個の点を使って文字を表します。

6個の点は、それぞれ「出っ張っている」「出っ張っていない」の2通り。

だから組み合わせは、

2⁶＝64通り。

たった6個の点から、64種類のパターンを作ることができます。

実際には、64通りすべてを1文字ずつ割り当てるのではなく、かな、数字、アルファベット、濁点、句読点などを、点の組み合わせやルールを使って表現します。

小さな6個の点の組み合わせが、文字や数字、記号を伝える仕組みになっているんですね。`

人類の食生活が変わって顎が小さくなっても、歯の本数はそう簡単には変わらない。

2の5乗から出てきた32という数字が、人間の進化の名残にも登場するんですね。`

    {

今のスマートフォンでは、何GB、何TBという数字が当たり前。でも当時のコンピューターが記憶できた量は、たった128バイト。

これは英数字なら、ざっくり100文字ちょっと。

今この文章を全部覚えることすら難しいくらいの容量です。

それでも、この小さな記憶装置を使って、コンピューターはプログラムを記憶し、実際に計算を行いました。

let remainingQuestions = [];
let currentQuestion = null;

let totalAnswered = 0;
let correctAnswers = 0;

let currentBlockAnswered = 0;
let finalStage = false;


/* =========================
   年に関する問題
========================= */

function getNextLeapYear() {

    const currentYear = new Date().getFullYear();

    let year = currentYear + 1;

    while (!isLeapYear(year)) {
        year++;
    }

    return String(year);
}

function isLeapYear(year) {

    return (
        year % 400 === 0 ||
        (year % 4 === 0 && year % 100 !== 0)
    );

}


/* =========================
   画面切り替え
========================= */

function hideAllScreens() {

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("continueScreen").classList.add("hidden");
    document.getElementById("finalStageScreen").classList.add("hidden");
    document.getElementById("finishScreen").classList.add("hidden");

}


/* =========================
   クイズ開始
========================= */

function startQuiz() {

    remainingQuestions = [...questions];

    totalAnswered = 0;
    correctAnswers = 0;
    currentBlockAnswered = 0;
    finalStage = false;

    hideAllScreens();

    nextQuestion();

}


/* =========================
   問題をランダムに取り出す
========================= */

function nextQuestion() {

    hideAllScreens();

    if (remainingQuestions.length === 0) {
        finishQuiz();
        return;
    }

    const randomIndex =
        Math.floor(Math.random() * remainingQuestions.length);

    currentQuestion =
        remainingQuestions.splice(randomIndex, 1)[0];

    document.getElementById("question").textContent =
        currentQuestion.question;

    document.getElementById("answer").value = "";

    document.getElementById("answer").disabled = false;

    document.getElementById("result").textContent = "";

    document.getElementById("explanation").textContent = "";

    document.getElementById("nextButton").classList.add("hidden");

    document.getElementById("quizScreen").classList.remove("hidden");

    document.getElementById("answer").focus();

}


/* =========================
   答え合わせ
========================= */

function checkAnswer() {

    const answer =
        document.getElementById("answer").value.trim();

    const result =
        document.getElementById("result");

    if (answer === "") {
        return;
    }

    document.getElementById("answer").disabled = true;

    totalAnswered++;
    currentBlockAnswered++;

    const correct =
        currentQuestion.answer.includes(answer);

    const correctAnswerText =
        currentQuestion.answer.join(" または ");

    if (correct) {

        correctAnswers++;

        result.textContent =
            "正解！\n" +
            "正解は " +
            correctAnswerText +
            " です。";

    } else {

        result.textContent =
            "残念！\n" +
            "正解は " +
            correctAnswerText +
            " です。";

    }

    document.getElementById("explanation").textContent =
        currentQuestion.explanation;

    document.getElementById("nextButton").classList.remove("hidden");

}


/* =========================
   解説後の「次の問題へ」
========================= */

function nextAfterExplanation() {

    /*
     * まだブロック途中なら、そのまま次の問題へ
     */
    if (!finalStage && currentBlockAnswered < 5) {

        nextQuestion();

        return;
    }


    /*
     * 最終ステージ中なら、
     * 残りがなくなるまで続ける
     */
    if (finalStage) {

        if (remainingQuestions.length === 0) {

            finishQuiz();

        } else {

            nextQuestion();

        }

        return;
    }


    /*
     * 5問終了
     *
     * ここではまだ「まだやる？」を表示しない。
     * 5問目の解説を読んでから、
     * 「次の問題へ」を押した時点で表示する。
     */

    showContinueScreen();

}


/* =========================
   5問終了後
========================= */

function showContinueScreen() {

    hideAllScreens();

    const score =
        document.getElementById("score");

    score.textContent =
        correctAnswers + " / " + totalAnswered;

    document
        .getElementById("continueScreen")
        .classList.remove("hidden");

}


/* =========================
   「はい」
========================= */

function continueQuiz() {

    currentBlockAnswered = 0;

    /*
     * 残り9問以下なら最終ステージへ
     */
    if (remainingQuestions.length <= 9) {

        showFinalStage();

        return;
    }

    nextQuestion();

}


/* =========================
   最終ステージ表示
========================= */

function showFinalStage() {

    hideAllScreens();

    finalStage = true;

    document.getElementById("remainingCount").textContent =
        remainingQuestions.length;

    document
        .getElementById("finalStageScreen")
        .classList.remove("hidden");

}


/* =========================
   最終ステージ開始
========================= */

function startFinalStage() {

    currentBlockAnswered = 0;

    nextQuestion();

}


/* =========================
   クイズ終了
========================= */

function finishQuiz() {

    hideAllScreens();

    document.getElementById("finalScore").textContent =
        correctAnswers + " / " + totalAnswered;

    document
        .getElementById("finishScreen")
        .classList.remove("hidden");

}


/* =========================
   クイズをやめる
========================= */

function quitQuiz() {

    window.location.href = "index.html";

}


/* =========================
   Enterキーでも回答
========================= */

document
    .getElementById("answer")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            checkAnswer();

        }

    });

</script>
