<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>正解履歴</title>

<style>
body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 60px 20px;
    color: #222;
}

h1 {
    font-weight: normal;
    text-align: center;
    margin-bottom: 40px;
}

#history {
    line-height: 1.8;
}

.back {
    text-align: center;
    margin-top: 50px;
}

button {
    padding: 12px 22px;
    font-size: 16px;
    cursor: pointer;
}

.history-item {
    margin-bottom: 15px;
    border-bottom: 1px solid #ddd;
}

.history-question {
    width: 100%;
    text-align: left;
    border: none;
    background: none;
    padding: 15px 5px;
    margin: 0;
    font-size: 18px;
    line-height: 1.6;
}

.history-detail {
    display: none;
    text-align: left;
    padding: 0 5px 20px;
    line-height: 1.9;
    white-space:  normal;
}

.history-item.open .history-detail {
    display: block;
}
</style>

</head>

<body>

<h1>正解履歴</h1>

<div id="history">
    <p>ここに正解した問題が表示されます。</p>
</div>

<div class="back">
    <button onclick="location.href='quiz.html'">
        クイズに戻る
    </button>
</div>

<script src="quiz_data.js"></script>

<script>

const solvedQuestions =
    JSON.parse(localStorage.getItem("solvedQuestions")) || [];

const history =
    document.getElementById("history");

if (solvedQuestions.length === 0) {

    history.innerHTML =
        "<p>まだ正解した問題はありません。</p>";

} else {

    history.innerHTML = "";

    solvedQuestions.forEach(function(id) {

    const question =
        questions.find(function(q) {
            return q.id === id;
        });

    if (!question) return;

    const item =
        document.createElement("div");

    item.className = "history-item";

    item.innerHTML = `
        <button class="history-question">
            ${question.question} ▾
        </button>

        <div class="history-detail">
            <strong>
                正解：${question.answer.join(" または ")}
            </strong>

            <p>
                ${question.explanation}
            </p>
        </div>
    `;

    const questionButton =
        item.querySelector(".history-question");

    questionButton.addEventListener("click", function() {

        item.classList.toggle("open");

        if (item.classList.contains("open")) {
            questionButton.textContent =
                question.question + " ▴";
        } else {
            questionButton.textContent =
                question.question + " ▾";
        }

    });

    history.appendChild(item);

});

}

</script>
</body>
</html>
