<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Audio Library</title>

<style>
body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 80px 20px;
    text-align: center;
    color: #222;
}

h1 {
    font-weight: normal;
    margin-bottom: 40px;
}

.description {
    line-height: 1.8;
    margin-bottom: 45px;
}

.qr-label {
    width: 100%;
    max-width: 400px;
    height: auto;
    display: block;
    margin: 30px auto 45px;
}

input {
    width: 200px;
    padding: 12px;
    font-size: 18px;
    box-sizing: border-box;
    text-align: center;
    margin-top: 10px;
}

button {
    padding: 12px 22px;
    font-size: 16px;
    margin-left: 8px;
    cursor: pointer;
}

#error {
    margin-top: 25px;
    min-height: 1.8em;
}

#next {
    margin-top: 20px;
}

#next a {
    text-decoration: none;
}

#next button {
    margin-left: 0;
}
</style>

</head>

<body>

<h1>ようこそ</h1>

<div class="description">
<p>
このページは、作品の音源をお楽しみいただくためのページです。
</p>
</div>

<img src="qrpr.PNG" alt="QRコードラベル" class="qr-label">

<p>
QRコードの右下にある文字列を入力↑<br>
※この画像は見本です。
</p>

<input
    type="password"
    id="password"
    inputmode="numeric"
    maxlength="6"
>

<button onclick="checkPassword()">ENTER</button>

<p id="error"></p>

<div id="next"></div>

<script>

let wrongCount = 0;
let primeCount = 0;
let ikisugiCount = 0;
let totalFailCount = 0; // 全失敗回数を記録する変数

function isPrime(n) {
    if (n < 2) return false;
    for (let i = 2; i <= Math.sqrt(n); i++) {
        if (n % i === 0) return false;
    }
    return true;
}

// クイズへの誘導を表示する共通関数
function checkQuizPrompt(next) {
    totalFailCount++;
    if (totalFailCount >= 10) {
        next.innerHTML += `
            <div style="margin-top:20px;">
                <p>ひまなの？クイズする？</p>
                <button onclick="startQuiz()">はい</button>
                <button onclick="noQuiz()">いいえ</button>
            </div>
        `;
        totalFailCount = 0;
    }
}

function checkPassword() {
    const password = document.getElementById("password").value;
    document.getElementById("password").value = "";
    const error = document.getElementById("error");
    const next = document.getElementById("next");
    next.innerHTML = "";

    // 45 / 19 系
    let specialMessage = "";
    if (password === "4545") specialMessage = "ヌッ！";
    else if (password === "454545") specialMessage = "ｱｰｲｷｿ";
    else if (password === "1919") specialMessage = "オォン!アォン!";
    else if (password === "191919") specialMessage = "ンアッー!";

    if (/^(45|19)+$/.test(password)) {
        ikisugiCount++;
        if (ikisugiCount >= 3) {
            error.textContent = "イキスギィ！";
            ikisugiCount = 0;
        } else if (specialMessage !== "") {
            error.textContent = specialMessage;
        } else {
            error.textContent = "";
        }
        checkQuizPrompt(next);
        return;
    }

    // 語呂合わせ・数学ネタ等 (ページ遷移しないものすべてに判定を通す)
    const checks = [
        {val: "2525", msg: "ニコニコ"}, {val: "4649", msg: "よろしく"},
        {val: "5963", msg: "ご苦労さん"}, {val: "39", msg: "サンキュー"},
        {val: "3150", msg: "最高"}, {val: "14106", msg: "愛してる"},
        {val: "110", msg: "おまわりさん？"}, {val: "119", msg: "救急車？"},
        {val: "1192", msg: "いいハコじゃないの？"}, {val: "1185", msg: "いいクニじゃないの？"},
        {val: "710", msg: "納豆？"}, {val: "801", msg: "やおい"},
        {val: "831", msg: "野菜"}, {val: "4126", msg: "よい風呂"},
        {val: "141421", msg: "一夜一夜に人見頃、√2ですね！"}, {val: "173205", msg: "人並みにおごれや、√3ですね！"},
        {val: "223606", msg: "富士山麓オウム鳴く、√5ですね！"}, {val: "123", msg: "ヒフミやん..."}, {val: "123123", msg: "ヒフミやん..."},
        {val: "456", msg: "シゴロが出た！"}, {val: "456456", msg: "シゴロが出た！"}, {val: "0721", msg: "やりますねえ！"},
        {val: "810", msg: "ファッ！？"}, {val: "36", msg: "36…普通だな！"}, {val: "889464", msg: "あくしろよ"},
        {val: "364364", msg: "ホラ、見ろよ見ろよ、ホラ"}, {val: "1", msg: "自然数の始まり"}, {val: "2", msg: "最初の素数"},
        {val: "3", msg: "奇数"}, {val: "6", msg: "完全数！"}, {val: "28", msg: "完全数！"}, {val: "496", msg: "完全数！"},
        {val: "8128", msg: "完全数！"}, {val: "11", msg: "ゾロ目"}, {val: "22", msg: "素数じゃない"},
        {val: "111", msg: "三桁ゾロ目"}, {val: "121", msg: "平方数！"}, {val: "144", msg: "12²でしょう"},
        {val: "169", msg: "13²でしょう"}, {val: "196", msg: "14²でしょう"}, {val: "225", msg: "15²でしょう"},
        {val: "343", msg: "7³でしょう"}, {val: "1024", msg: "2の10乗！！"}, {val: "999983", msg: "6桁で最大の素数だ！わーい！"},
        {val: "314159", msg: "π……？"}, {val: "271828", msg: "e……？"}, {val: "161803", msg: "黄金比だ！"},
        {val: "112358", msg: "フィボナッチ！"}, {val: "142857", msg: "循環してる！"}, {val: "123456", msg: "階段やん"},
        {val: "234567", msg: "階段やん"}, {val: "345678", msg: "階段やん"}, {val: "456789", msg: "階段やん"},
        {val: "654321", msg: "降りてるやん"}, {val: "765432", msg: "降りてるやん"}, {val: "876543", msg: "降りてるやん"},
        {val: "987654", msg: "降りてるやん"}, {val: "111111", msg: "ピンゾロ！！！"}, {val: "222222", msg: "アラシ3倍！"},
        {val: "333333", msg: "アラシ3倍！"}, {val: "444444", msg: "アラシ3倍！"}, {val: "555555", msg: "アラシ3倍！"},
        {val: "666666", msg: "アラシ3倍！"}, {val: "777777", msg: "めでたいですね"}, {val: "888888", msg: "ヤンキーの車番じゃないんだから"},
        {val: "999999", msg: "やり直し"}
    ];

    for (let c of checks) {
        if (password === c.val) {
            error.textContent = c.msg;
            checkQuizPrompt(next);
            return;
        }
    }

    // 遷移系
    if (password === "074874") { error.textContent = "いらっしゃいませ"; next.innerHTML = '<a href="audio.html"><button>音源はこちら</button></a>'; return; }
    if (password === "442911") { error.textContent = "いらっしゃいませ"; next.innerHTML = '<a href="shoufuku.html"><button>招福来来ボーイへ</button></a>'; return; }
    if (password === "843811") { error.textContent = "いらっしゃいませ"; next.innerHTML = '<a href="https://share.google/zcnrAHNT6O7MTd5ax" target="_blank"><button>丸美焼肉店へ</button></a>'; return; }
    if (password === "114514") { error.textContent = "入って、どうぞ"; next.innerHTML = '<a href="https://youtu.be/niKAylKNIEI?si=tJOFKXD7AdBn0QUQ" target="_blank"><button>こ↑こ↓</button></a>'; return; }

    // 累乗系
    const pNum = Number(password);
    if (password !== "" && pNum >= 2 && Number.isInteger(Math.log2(pNum))) { error.textContent = `2の${Math.log2(pNum)}乗ですね！`; checkQuizPrompt(next); return; }
    const pThree = Math.log(pNum) / Math.log(3);
    if (password !== "" && pNum > 0 && Number.isInteger(pThree)) { error.textContent = `3の${pThree}乗ですね！`; checkQuizPrompt(next); return; }

    // 素数
    if (password !== "" && isPrime(pNum)) {
        primeCount++;
        error.textContent = (primeCount >= 3) ? "素数ばっか探してないでさ" : "素数だ！わーい";
        checkQuizPrompt(next);
        return;
    }

    // 最後の砦
    wrongCount++;
    checkQuizPrompt(next);
    if (password === "000000") { error.textContent = "そんなわけない"; return; }
    if (wrongCount === 3) error.textContent = "またちがうやん";
    else if (wrongCount === 4) error.textContent = "えっ？";
    else if (wrongCount === 5) error.textContent = "そろそろ…";
    else if (wrongCount === 6) error.textContent = "おちついて！";
    else if (wrongCount === 7) error.textContent = "ガンバレ、ガンバレ";
    else if (wrongCount === 8) error.textContent = "ほんとにCDみてる？";
    else if (wrongCount === 9) error.textContent = "教えてあげようか？";
    else if (wrongCount === 10) error.textContent = "じゃあ一つだけ。「843811」入力して";
    else error.textContent = "それじゃない！よくみて";
}

function startQuiz() { window.location.href = "quiz.html"; }
function noQuiz() { document.getElementById("error").textContent = "そうですか……"; document.getElementById("next").innerHTML = ""; }
</script>
</body>
</html>
